[model]
desc = 'model parameters'
type = "PROTAC-STAN"
seed = 21332

[model.protac]
feature = 146  # 从312改为146（移除了166维MACCS）
embed = 64
hidden = 128
edge_dim = 3
fingerprint_dim = 166

[model.protein]
embed = 1280
hidden = 128
out_dim = 64

[model.tan]
in_dims = [1, 1, 1]
heads = 2

[model.clf]
embed = 192
hidden = 64
class = 2

[model.contrast]
# 三模态共享对比空间维度（默认等于 protein.out_dim）
proj_dim = 256
# 三对单体模态（PROTAC-E3 / PROTAC-POI / E3-POI）的相对权重
lambda_pe = 1
lambda_po = 1
lambda_eo = 1
# 二元复合体 ↔ 第三方 模态的相对权重
# (PE) PROTAC-E3 ↔ POI, (PO) PROTAC-POI ↔ E3
lambda_pe_poi = 0
lambda_po_e3 = 0


[train]
desc = 'train parameters'
learning_rate = 0.0005
batch_size = 8
num_epochs = 100
train_ratio = 0.8
contrast_weight = 0.1
contrast_temperature = 0.1
contrast_only_positive = true
