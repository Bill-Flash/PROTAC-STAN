[model]
desc = 'model parameters'
type = "PROTAC-STAN"
seed = 21332

[model.protac]
feature = 146  # 从312改为146（移除了166维MACCS）
embed = 64
hidden = 128
edge_dim = 3
fingerprint_dim = 166

[model.protein]
embed = 1280          # 仅 legacy 模式使用
hidden = 128
out_dim = 64
mode = "online_esm"   # 切换到在线 ESM2 模式：online_esm / legacy
freeze_esm = false    # 设为 false：允许端到端微调整个 ESM2 backbone
pooling = "mean"      # ESM2 表示聚合方式：mean / cls
model_name = "facebook/esm2_t6_8M_UR50D"  # 使用更小的 ESM2 8M模型， esm2_t6_8M_UR50D/esm2_t12_35M_UR50D/esm2_t30_150M_UR50D
use_lora = false      # 设为 false：不再只训练 LoRA，改为直接全参数微调 ESM2
lora_r = 4            # 预留参数（当前不用）
lora_alpha = 16       # 预留参数（当前不用）
lora_dropout = 0.05   # 预留参数（当前不用）

[model.tan]
in_dims = [1, 1, 1]
heads = 2

[model.clf]
embed = 192
hidden = 64
class = 2


[train]
desc = 'train parameters'
learning_rate = 0.0005      # 下游模块学习率
lora_learning_rate = 0.00001  # LoRA 专用学习率 1e-5
batch_size = 4
num_epochs = 100
train_ratio = 0.8
